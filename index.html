    const embeddedFiles = {"app.py": "\"\"\"\nENIGMA — Explainable Password Risk Analysis Workbench\nXbox PC App-Inspired UI/UX Redesign\nDecodeLabs Industrial Training Kit 2026 | Project 1: Password Strength Checker\n\nTagline: \"Decode the pattern. Reveal the risk. Protect the secret.\"\nLocal-first, deterministic, explainable cybersecurity workbench.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport streamlit as st\nimport unicodedata\nfrom analyzer import (\n    PasswordAnalyzer,\n    RiskLevel,\n    Severity,\n    is_common_password,\n    generate_random_password,\n    generate_passphrase,\n    get_dataset_size,\n)\n\n# Page configuration\nst.set_page_config(\n    page_title=\"ENIGMA | Password Security Workbench\",\n    page_icon=\"🛡️\",\n    layout=\"wide\",\n    initial_sidebar_state=\"expanded\",\n)\n\n# ------------------------------------------------------------------------------\n# XBOX PC APP-INSPIRED DESIGN SYSTEM & CSS\n# ------------------------------------------------------------------------------\nXBOX_THEME_CSS = \"\"\"\n<style>\n@import url('https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap');\n\n:root {\n    --bg-main: #101210;\n    --bg-sidebar: #191C19;\n    --bg-card: #202420;\n    --bg-card-hover: #262B26;\n    --bg-card-secondary: #161916;\n    --border-color: #343A34;\n    --border-subtle: #2A302A;\n    --xbox-green: #80CC14;\n    --xbox-green-hover: #9BE622;\n    --xbox-green-dim: rgba(128, 204, 20, 0.12);\n    --text-primary: #F4F6F2;\n    --text-secondary: #A5ADA3;\n    --text-muted: #6E766D;\n    --weak-red: #EF4444;\n    --weak-red-dim: rgba(239, 68, 68, 0.12);\n    --medium-amber: #F59E0B;\n    --medium-amber-dim: rgba(245, 158, 11, 0.12);\n    --strong-green: #80CC14;\n    --strong-green-dim: rgba(128, 204, 20, 0.12);\n    --card-radius: 10px;\n    --btn-radius: 6px;\n}\n\n/* Global Application Background */\nbody, .s _pwd_input)\n    st.toast(\"Reset to DecodeLabs defaults (8 chars, 3 classes)!\", icon=\"✅\")\n\n# Active Analyzer Engine configured with current policy settings\nanalyzer = PasswordAnalyzer(\n    min_length_policy=st.session_state.min_length_policy,\n    min_classes_policy=st.session_state.min_classes_policy\n)\n\n# ------------------------------------------------------------------------------\n# SIDEBAR: COMPACT, QUIET XBOX-STYLE VERTICAL NAVIGATION (5 ITEMS)\n# ------------------------------------------------------------------------------\nwith st.sidebar:\n    # Brand & Wordmark\n    st.markdown(\n        \"\"\"\n        <div style=\"padding: 10px 4px 18px 4px;\">\n            <div style=\"display:flex; align-items:center; gap:10px;\">\n                <span style=\"font-size: 1.6rem;\">🛡️</span>\n                <div>\n                    <div style=\"font-size: 1.3rem; font-weight: 800; letter-spacing: 0.04em; color: #F4F6F2; line-height: 1.1;\">\n                        ENIGMA\n                    </div>\n                    <div style=\"font-size: 0.72rem; color: #80CC14; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;\">\n                        Password Security Workbench\n                    </div>\n                </div>\n            </div>\n            <div style=\"font-size: 0.78rem; color: #6E766D; margin-top: 6px; font-style: italic;\">\n                \"Decode the pattern. Reveal the risk. Protect the secret.\"\n            </div>\n        </div>\n        \"\"\",\n        unsafe_allow_html=True\n    )\n\n    st.markdown(\"<div style='height: 1px; background: #343A34; margin-bottom: 16px;'></div>\", unsafe_allow_html=True)\n\n    # 5 Clean Navigation Menu Items (Security Insights removed per user request)\n    nav_options = [\n        \"🏠 Home\",\n        \"🔍 Password Analyzer\",\n        \"🎮 Pattern Lab\",\n        \"⚡ Secure Generator\",\n        \"⚙️ Settings\",\n    ]\n\n    # Ensure nav_choice is valid\n    if st.session_st  },\n        {\n            \"category\": \"SEQUENTIAL RUN\",\n            \"name\": \"Ascending Numbers\",\n            \"pwd\": \"Safe12345678!\",\n            \"desc\": \"Word followed by an 8-digit consecutive counting sequence.\",\n            \"legacy\": \"PASS (4/4 Classes)\",\n            \"enigma\": \"WEAK (Sequential Progression)\",\n            \"icon\": \"🔢\"\n        }\n    ]\n\n    # Render in 2 columns\n    for i in range(0, len(pattern_cases), 2):\n        col_left, col_right = st.columns(2)\n        for col, case_data in zip([col_left, col_right], pattern_cases[i:i+2]):\n            with col:\n                st.markdown(\n                    f\"\"\"\n                    <div class=\"xbox-tile\" style=\"margin-bottom: 16px;\">\n                        <div>\n                            <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;\">\n                                <span class=\"xbox-badge xbox-badge-neutral\">{case_data['category']}</span>\n                                <span style=\"font-size:1.3rem;\">{case_data['icon']}</span>\n                            </div>\n                            <div class=\"xbox-tile-title\">{case_data['name']}</div>\n                            <div style=\"background:#161916; border:1px solid #2A302A; border-radius:4px; padding:6px 10px; margin:8px 0; font-family:'JetBrains Mono'; font-size:0.9rem; color:#80CC14;\">\n                                {case_data['pwd']}\n                            </div>\n                            <div class=\"xbox-tile-desc\">{case_data['desc']}</div>\n                            <div style=\"font-size:0.8rem; margin-bottom:12px; line-height:1.6;\">\n                                <span style=\"color:#EF4444;\">Legacy Checkbox: <b>{case_data['legacy']}</b></span><br>\n                                <span style=\"color:#80CC14;\">ENIGMA Verdict: <b>{case_data['enigma']}</b></span>\n                            </div>\n                        </div>\n                    </div>\n                    \"\"\",\n                    unsafe_allow_html=True\n                )\n                st.button(\n                    f\"Inspect '{case_data['pwd']}' in Analyzer\",\n                    key=f\"btn_inspect_{case_data['pwd']}\",\n                    use_container_width=True,\n                    on_click=inspect_password_in_analyzer,\n                    args=(case_data['pwd'],)\n                )\n\n\n# ==============================================================================\n# SCREEN 4: SECURE GENERATOR\n# ==============================================================================\nelif st.session_state.nav_choice == \"⚡ Secure Generator\":\n    st.markdown(\n        \"\"\"\n        <div style=\"margin-bottom: 20px;\">\n            <h1 style=\"font-size: 1.9rem; font-weight: 800; color: #F4F6F2; margin: 0 0 4px 0; letter-spacing: -0.02em;\">\n                SECURE CREDENTIAL GENERATOR\n            </h1>\n            <div style=\"font-size: 0.98rem; color: #A5ADA3;\">\n                Generate strong random credentials locally using Python's secrets module.\n            </div>\n        </div>\n        \"\"\",\n        unsafe_allow_html=True\n    )\n\n    t_rnd, t_pass = st.tabs([\"🎲 High-Entropy Random Password\", \"📖 Memorable Multi-Word Passphrase\"])\n\n    with t_rnd:\n        with st.container():\n            st.markdown(\n                \"\"\"\n                <div class=\"xbox-card\">\n                    <div class=\"xbox-card-header\">\n                        <span>Configuration: Random Character Token</span>\n                    </div>\n                \"\"\",\n                unsafe_allow_html=True\n            )\n            col_glen, col_gpools = st.columns([1, 2])\n            with col_glen:\n                gen_len = st.slider(\"Password Length\", min_value=12, max_value=64, value=16, key=\"gen_rnd_len\")\n            with col_gpools:\n                st.write(\"Character Classes Included:\")\n                g_u = st.checkbox(\"Uppercase Letters (A-Z)\", value=True, key=\"gen_u\")\n                g_l = st.checkbox(\"Lowercase Letters (a-z)\", value=True, key=\"gen_l\")\n                g_d = st.checkbox(\"Digits (0-9)\", value=True, key=\"gen_d\")\n                g_s = st.checkbox(\"Symbols (!@#$%...)\", value=True, key=\"gen_s\")\n\n            if st.button(\"Generate Random Password\", type=\"primary\", use_container_width=True, key=\"btn_gen_rnd\"):\n                new_pwd = generate_random_password(\n                    length=gen_len,\n                    use_upper=g_u,\n                    use_lower=g_l,\n                    use_digits=g_d,\n                    use_symbols=g_s\n                )\n                st.session_state.generated_credential = new_pwd\n\n            st.markdown(\"</div>\", unsafe_allow_html=True)\n\n    with t_pass:\n        with st.container():\n            st.markdown(\n                \"\"\"\n                <div class=\"xbox-card\">\n                    <div class=\"xbox-card-header\">\n                        <span>Configuration: EFF-Style Diceware Passphrase</span>\n                    </div>\n                \"\"\",\n                unsafe_allow_html=True\n            )\n            col_pw, col_psep = st.columns(2)\n            with col_pw:\n                w_count = st.slider(\"Word Count\", min_value=4, max_value=8, value=5, key=\"gen_w_count\")\n            with col_psep:\n                w_sep = st.selectbox(\"Word Separator\", options=[\"-\", \"_\", \".\", \" \"], index=0, key=\"gen_w_sep\")\n\n            col_pcap, col_pnum = st.columns(2)\n            with col_pcap:\n                w_cap = st.checkbox(\"Capitalize Words\", value=True, key=\"gen_w_cap\")\n            with col_pnum:\n                w_num = st.checkbox(\"Append Random 2-digit Number\", value=True, key=\"gen_w_num\")\n\n            if st.button(\"Generate Passphrase\", type=\"primary\", use_container_width=True, key=\"btn_gen_pass\"):\n                new_phrase = generate_passphrase(\n                    word_count=w_count,\n                    separator=w_sep,\n                    capitalize_words=w_cap,\n                    append_number=w_num\n                )\n                st.session_state.generated_credential = new_phrase\n\n            st.markdown(\"</div>\", unsafe_allow_html=True)\n\n    # Generated Credential Display Panel\n    if st.session_state.generated_credential:\n        cred = st.session_state.generated_credential\n        st.markdown(\n            f\"\"\"\n            <div class=\"xbox-card\" style=\"border: 1px solid #80CC14; background: #161B16;\">\n                <div style=\"font-size: 0.82rem; font-weight:700; color: #80CC14; text-transform:uppercase; margin-bottom: 6px;\">\n                    GENERATED CREDENTIAL\n                </div>\n                <div style=\"font-family:'JetBrains Mono'; font-size:1.35rem; color:#F4F6F2; padding:12px; background:#101210; border-radius:6px; word-break:break-all; border:1px solid #2A302A;\">\n                    {cred}\n                </div>\n                <div style=\"font-size:0.8rem; color:#6E766D; margin-top:8px;\">\n                    🔒 Generated locally in RAM via os.urandom. Never transmitted or persisted.\n                </div>\n            </div>\n            \"\"\",\n            unsafe_allow_html=True\n        )\n\n        col_load, col_clear_gen = st.columns([2, 1])\n        with col_load:\n            st.button(\n                \"Analyze this in Password Analyzer →\",\n                use_container_width=True,\n                key=\"btn_analyze_generated_cred\",\n                on_click=analyze_generated_credential\n            )\n        with col_clear_gen:\n            st.button(\n                \"Clear Generated\",\n                use_container_width=True,\n                key=\"btn_clear_generated_cred\",\n                on_click=clear_generated_credential\n            )\n\n\n# ==============================================================================\n# SCREEN 5: SETTINGS\n# ==============================================================================\nelif st.session_state.nav_choice == \"⚙️ Settings\":\n    st.markdown(\n        \"\"\"\n        <div style=\"margin-bottom: 20px;\">\n            <h1 style=\"font-size: 1.9rem; font-weight: 800; color: #F4F6F2; margin: 0 0 4px 0; letter-spacing: -0.02em;\">\n                SETTINGS & POLICY CONFIGURATION\n            </h1>\n            <div style=\"font-size: 0.98rem; color: #A5ADA3;\">\n                Configure organizational baseline thresholds and inspection rules.\n            </div>\n        </div>\n        \"\"\",\n        unsafe_allow_html=True\n    )\n\n    with st.container():\n        st.markdown(\n            \"\"\"\n            <div class=\"xbox-card\">\n                <div class=\"xbox-card-header\">\n                    <span>⚙️ Organizational Baseline Policy</span>\n                </div>\n            \"\"\",\n            unsafe_allow_html=True\n        )\n\n        col_s_len, col_s_classes = st.columns(2)\n        with col_s_len:\n            # FIX: Slider uses explicit key=\"slider_min_length\" and on_change callback\n            st.slider(\n                \"Minimum Length Policy\",\n                min_value=6,\n                max_value=24,\n                key=\"slider_min_length\",\n                on_change=on_policy_slider_change,\n                help=\"DecodeLabs minimum assignment requirement is 8 code points.\"\n            )\n            st.caption(\"Baseline minimum required for policy compliance. (Standard assignment value is 8 characters).\")\n\n        with col_s_classes:\n            # FIX: Slider uses explicit key=\"slider_min_classes\" and on_change callback\n            st.slider(\n                \"Minimum Character Classes\",\n                min_value=1,\n                max_value=4,\n                key=\"slider_min_classes\",\n                on_change=on_policy_slider_change,\n                help=\"Classes: Uppercase, Lowercase, Digits, Symbols.\"\n            )\n            st.caption(\"Number of independent character classes required to satisfy organizational policy.\")\n\n        st.markdown(\"<div style='height: 14px;'></div>\", unsafe_allow_html=True)\n\n        # FIX: Reset button invokes callback that resets both slider session keys before widgets render\n        st.button(\n            \"Reset to DecodeLabs Defaults (8 chars, 3 classes)\",\n            on_click=reset_policy_defaults,\n            use_container_width=True,\n            key=\"btn_reset_policy_defaults\"\n        )\n\n        st.markdown(\"</div>\", unsafe_allow_html=True)\n\n    # Active Policy Summary Card\n    st.markdown(\n        f\"\"\"\n        <div class=\"xbox-card\" style=\"border-left: 3px solid #80CC14;\">\n            <div style=\"font-weight: 600; color: #F4F6F2; margin-bottom: 4px;\">Active Configuration Summary</div>\n            <div style=\"font-size: 0.88rem; color: #A5ADA3; line-height: 1.5;\">\n                • Length Floor: <b>{st.session_state.min_length_policy}</b> characters.<br>\n                • Minimum Character Classes: <b>{st.session_state.min_classes_policy}</b> of 4 required.<br>\n                • Offline Signatures: <b>{get_dataset_size():,}</b> weak passwords loaded in memory.<br>\n                • Maximum Input Cap: <b>512</b> Unicode code points (DoS/ReDoS protection).\n            </div>\n        </div>\n        \"\"\",\n        unsafe_allow_html=True\n    )\n", "analyzer/__init__.py": "\"\"\"\nENIGMA Analyzer Package\nExplainable Password Risk Analysis Workbench\nDecodeLabs Industrial Training Kit 2026\n\"\"\"\n\nfrom .engine import (\n    PasswordAnalyzer,\n    AnalysisResult,\n    RiskLevel,\n    PolicyResult,\n    CharacterMetrics,\n    EntropyEstimate,\n    VerdictStep,\n)\nfrom .patterns import (\n    Finding,\n    Severity,\n    run_all_pattern_detectors,\n)\nfrom .common_passwords import (\n    is_common_password,\n    get_dataset_size,\n    secure_compare_digest,\n)\nfrom .generator import (\n    generate_random_password,\n    generate_passphrase,\n)\nfrom .timing import (\n    run_timing_demonstration,\n    evaluate_gatekeeper_rule,\n)\n\n__all__ = [\n    \"PasswordAnalyzer\",\n    \"AnalysisResult\",\n    \"RiskLevel\",\n    \"PolicyResult\",\n    \"CharacterMetrics\",\n    \"EntropyEstimate\",\n    \"VerdictStep\",\n    \"Finding\",\n    \"Severity\",\n    \"run_all_pattern_detectors\",\n    \"is_common_password\",\n    \"get_dataset_size\",\n    \"secure_compare_digest\",\n    \"generate_random_password\",\n    \"generate_passphrase\",\n    \"run_timing_demonstration\",\n    \"evaluate_gatekeeper_rule\",\n]\n", "analyzer/engine.py": "\"\"\"\nExplainable Password Risk Engine for ENIGMA\nImplements the core Input-Process-Output (IPO) architecture for local-first risk analysis.\n\nDesign Principles:\n- Deterministic rules engine with documented precedence.\n- Pure string analysis without external network transmission.\n- Unicode-aware code point measurement.\n- Explicit decoupling of Policy Compliance from true Risk Assessment.\n- Explainable Verdict Trace detailing every stage of evaluation.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport math\nimport string\nimport unicodedata\nfrom dataclasses import dataclass, field\nfrom enum import Enum\nfrom typing import Dict, List, Optional, Tuple\n\nfrom .common_passwords import is_common_password, get_dataset_size\nfrom .patterns import (\n    Finding,\n    Severity,\n    run_all_pattern_detectors\n)\nfrom .recommendations import generate_recommendations\n\n\nclass RiskLevel(Enum):\n    WEAK = \"WEAK\"\n    MEDIUM = \"MEDIUM\"\n    STRONG = \"STRONG\"\n\n\n@dataclass(frozen=True)\nclass PolicyResult:\n    \"\"\"Represents the explicit assignment policy compliance check.\"\"\"\n    compliant: bool\n    min_length_required: int\n    actual_length: int\n    has_upper: bool\n    has_lower: bool\n    has_digit: bool\n    has_symbol: bool\n    classes_satisfied: int\n    min_classes_required: int\n    summary_message: str\n\n\n@dataclass(frozen=True)\nclass CharacterMetrics:\n    \"\"\"Detailed composition metrics measured across Unicode code points.\"\"\"\n    length: int\n    upper_count: int\n    lower_count: int\n    digit_count: int\n    symbol_count: int\n    whitespace_count: int\n    unicode_non_ascii_count: int\n    combining_marks_count: int\n    unique_char_count: int\n    estimated_charset_pool_size: int\n    has_unicode_normalization_difference: bool\n\n\n@dataclass(frozen=True)\nclass EntropyEstimate:\n    \"\"\"\n    Theoretical pool entropy calculation with transparent educational limitations.\n    Formula: E = L * log2(R) where L is length and R is pool size.\n    \"\"\"\n    bits: float\n    pool_size: int\n    formula_description: str\n    educational_caveat: str\n\n\n@dataclass(frozen=True)\nclass VerdictStep:\n    \"\"\"Single step in the explainable decision audit pipeline.\"\"\"\n    stage: str\n    rule_applied: str\n    outcome: str\n    impact: str\n    security_reasoning: str\n\n\n@dataclass\nclass AnalysisResult:\n    \"\"\"Comprehensive, structured evaluation result returned by the ENIGMA engine.\"\"\"\n    risk_level: RiskLevel\n    policy_result: PolicyResult\n    metrics: CharacterMetrics\n    entropy: EntropyEstimate\n    findings: List[Finding]\n    positive_observations: List[str]\n    limitations: List[str]\n    verdict_trace: List[VerdictStep]\n    recommendations: List[str] = field(default_factory=list)\n\n    def to_dict(self) -> dict:\n        return {\n            \"risk_level\": self.risk_level.value,\n            \"policy_compliant\": self.policy_result.compliant,\n            \"length\": self.metrics.length,\n            \"classes_satisfied\": self.policy_result.classes_satisfied,\n            \"entropy_bits\": round(self.entropy.bits, 1),\n            \"findings_count\": len(self.findings),\n            \"findings\": [f.to_dict() for f in self.findings],\n            \"positive_observations\": self.positive_observations,\n            \"recommendations\": self.recommendations,\n            \"verdict_trace\": [\n                {\n                    \"stage\": s.stage,\n                    \"rule\": s.rule_applied,\n                    \"outcome\": s.outcome,\n                    \"reasoning\": s.security_reasoning\n                }\n                for s in self.verdict_trace\n            ]\n        }\n\n\nclass PasswordAnalyzer:\n    \"\"\"\n    The main analyzer engine implementing the DecodeLabs Defensive Logic curriculum.\n    Deterministic, linear-time, and privacy-preserving.\n    \"\"\"\n\n    def __init__(\n        self,\n        min_length_policy: int = 8,\n        min_classes_policy: int = 3,\n        max_input_length: int = 512\n    ):\n        self.min_length_policy = min_length_policy\n        self.min_classes_policy = min_classes_policy\n        self.max_input_length = max_input_length\n\n    def analyze(self, password: Optional[str]) -> AnalysisResult:\n        \"\"\"\n        Executes the end-to-end Explainable Risk Analysis pipeline.\n        \n        Pipeline:\n        1. Input Validation & Bounds Check\n        2. Unicode Code Point & Character Set Metric Extraction\n        3. Assignment Policy Compliance Verification\n        4. Offline Common-Password & Predictable Pattern Detection\n        5. Decision Precedence Rules Arbitration\n        6. Theoretical Entropy Estimation\n        7. Verdict Trace Construction ('Decode the Verdict')\n        8. Context-Aware Recommendations Generation\n        \"\"\"\n        # --- Stage 1: Input Validation ---\n        if password is None:\n            password = \"\"\n\n        # Guard against denial of service / memory abuse\n        if len(password) > self.max_input_length:\n            raise ValueError(\n                f\"Password length ({len(password)}) exceeds maximum supported limit \"\n                f\"of {self.max_input_length} code points.\"\n            )\n\n        # Empty password check\n        if len(password) == 0:\n            return self._build_empty_result()\n\n        # --- Stage 2: Character Metrics & Unicode Inspection ---\n        metrics = self._inspect_character_composition(password)\n\n        # --- Stage 3: Policy Compliance Check ---\n        policy_res = self._evaluate_policy(metrics)\n\n        # --- Stage 4: Pattern Detection & Common Passwords ---\n        findings: List[Finding] = []\n        positive_observations: List[str] = []\n\n        # Check offline weak credentials dataset\n        is_common, reason = is_common_password(password)\n        if is_common:\n            findings.append(Finding(\n                id=\"VULN_COMMON_PASSWORD\",\n                title=\"Known Weak / Common Password\",\n                severity=Severity.CRITICAL,\n                description=f\"Identified in the offline weak credentials dataset ({reason}).\",\n                evidence_redacted=\"Credential matches a top-ranked weak/leaked password entry.\",\n                recommendation=\"Do not use known common passwords. Automated attack bots test these immediately.\"\n            ))\n        else:\n            positive_observations.append(\n                f\"No match in the offline database of {get_dataset_size():,} commonly targeted passwords.\"\n            )\n\n        # Run linear-time pattern detectors\n        pattern_findings = run_all_pattern_detectors(password)\n        findings.extend(pattern_findings)\n\n        # Positive observations for good composition\n        if metrics.length >= 14:\n            positive_observations.append(\"Length meets or exceeds modern enterprise recommendations (>= 14 chars).\")\n        elif metrics.length >= 8:\n            positive_observations.append(\"Length satisfies standard minimum baseline policy (>= 8 chars).\")\n\n        if policy_res.classes_satisfied >= 4:\n            positive_observations.append(\"Utilizes all four primary character classes (upper, lower, digits, symbols).\")\n        elif policy_res.classes_satisfied >= 3:\n            positive_observations.append(f\"Demonstrates multi-class diversity ({policy_res.classes_satisfied}/4 classes).\")\n\n        if metrics.unicode_non_ascii_count > 0:\n            positive_observations.append(\n                f\"Contains {metrics.unicode_non_ascii_count} non-ASCII Unicode code point(s), \"\n                f\"substantially expanding the attacker search space.\"\n            )\n\n        if not any(\"PATTERN_KEYBOARD\" in f.id for f in pattern_findings):\n            positive_observations.append(\"Free of spatial keyboard walk patterns.\")\n\n        if not any(\"PATTERN_SEQ\" in f.id for f in pattern_findings):\n            positive_observations.append(\"No contiguous alphabetical or numeric progressions detected.\")\n\n        # --- Stage 5: Decision Precedence Rules & Verdict Trace ---\n        risk_level, verdict_trace = self._evaluate_precedence(\n            password=password,\n            metrics=metrics,\n            policy_res=policy_res,\n            findings=findings\n        )\n\n        # --- Stage 6: Theoretical Entropy ---\n        entropy = self._calculate_entropy(metrics)\n\n        # --- Stage 7: Standard Limitations ---\n        limitations = [\n            \"Local offline static analysis: cannot detect whether this credential exists in newly leaked breach databases.\",\n            \"Personal context limitation: cannot identify personal identifiers (such as birth dates, pet names, or usernames) unless structured like generic years.\",\n            \"Host memory boundary: Python string immutability means secret remnants may linger in heap memory until CPython garbage collection occurs.\",\n            \"Evaluation scope: Password strength validation does not replace multi-factor authentication (MFA) or secure transport (TLS).\"\n        ]\n\n        # --- Stage 8: Assemble Result & Recommendations ---\n        result = AnalysisResult(\n            risk_level=risk_level,\n            policy_result=policy_res,\n            metrics=metrics,\n            entropy=entropy,\n            findings=findings,\n            positive_observations=positive_observations,\n            limitations=limitations,\n            verdict_trace=verdict_trace,\n        )\n        result.recommendations = generate_recommendations(result)\n        return result\n\n    def _inspect_character_composition(self, password: str) -> CharacterMetrics:\n        \"\"\"Measures length and character classes using Unicode-aware inspections.\"\"\"\n        upper = 0\n        lower = 0\n        digit = 0\n        symbol = 0\n        whitespace = 0\n        non_ascii = 0\n        combining = 0\n        unique_chars = set(password)\n\n        for ch in password:\n            cat = unicodedata.category(ch)\n\n            if ord(ch) > 127:\n                non_ascii += 1\n\n            if cat.startswith(\"M\"):\n                combining += 1\n\n            if ch.isspace():\n                whitespace += 1\n            elif ch.isupper() or cat.startswith(\"Lu\"):\n                upper += 1\n            elif ch.islower() or cat.startswith(\"Ll\"):\n                lower += 1\n            elif ch.isdigit() or cat.startswith(\"Nd\"):\n                digit += 1\n            elif (ch in string.punctuation) or cat.startswith(\"P\") or cat.startswith(\"S\"):\n                symbol += 1\n            else:\n                # Other characters (emojis, uncategorized symbols)\n                symbol += 1\n\n        # Calculate estimated pool size\n        pool = 0\n        if lower > 0:\n            pool += 26\n        if upper > 0:\n            pool += 26\n        if digit > 0:\n            pool += 10\n        if symbol > 0:\n            pool += 33\n        if whitespace > 0:\n            pool += 1\n        if non_ascii > 0:\n            # Add reasonable search space for international scripts\n            pool += 128\n\n        pool = max(pool, 1)\n\n        # Check if the input deviates from canonical NFC normalization form\n        nfc = unicodedata.normalize(\"NFC\", password)\n        has_norm_diff = (nfc != password)\n\n        return CharacterMetrics(\n            length=len(password),\n            upper_count=upper,\n            lower_count=lower,\n            digit_count=digit,\n            symbol_count=symbol,\n            whitespace_count=whitespace,\n            unicode_non_ascii_count=non_ascii,\n            combining_marks_count=combining,\n            unique_char_count=len(unique_chars),\n            estimated_charset_pool_size=pool,\n            has_unicode_normalization_difference=has_norm_diff\n        )\n\n    def _evaluate_policy(self, metrics: CharacterMetrics) -> PolicyResult:\n        \"\"\"Evaluates compliance against organizational baseline policy (DecodeLabs standard).\"\"\"\n        has_upper = metrics.upper_count > 0\n        has_lower = metrics.lower_count > 0\n        has_digit = metrics.digit_count > 0\n        has_symbol = metrics.symbol_count > 0\n\n        classes_satisfied = sum([has_upper, has_lower, has_digit, has_symbol])\n        length_ok = metrics.length >= self.min_length_policy\n        classes_ok = classes_satisfied >= self.min_classes_policy\n\n        compliant = length_ok and classes_ok\n\n        if compliant:\n            msg = f\"Complies with organizational baseline policy (Length: {metrics.length}/{self.min_length_policy}, Classes: {classes_satisfied}/{self.min_classes_policy}).\"\n        elif not length_ok and not classes_ok:\n            msg = f\"Non-compliant: Fails minimum length ({metrics.length}/{self.min_length_policy}) and character diversity ({classes_satisfied}/{self.min_classes_policy}).\"\n        elif not length_ok:\n            msg = f\"Non-compliant: Length {metrics.length} is below required minimum of {self.min_length_policy} code points.\"\n        else:\n            msg = f\"Non-compliant: Satisfies only {classes_satisfied} of {self.min_classes_policy} required character categories.\"\n\n        return PolicyResult(\n            compliant=compliant,\n            min_length_required=self.min_length_policy,\n            actual_length=metrics.length,\n            has_upper=has_upper,\n            has_lower=has_lower,\n            has_digit=has_digit,\n            has_symbol=has_symbol,\n            classes_satisfied=classes_satisfied,\n            min_classes_required=self.min_classes_policy,\n            summary_message=msg\n        )\n\n    def _evaluate_precedence(\n        self,\n        password: str,\n        metrics: CharacterMetrics,\n        policy_res: PolicyResult,\n        findings: List[Finding]\n    ) -> Tuple[RiskLevel, List[VerdictStep]]:\n        \"\"\"\n        Executes strict precedence arbitration.\n        Critical predictability rules OVERRIDE character diversity.\n        \"\"\"\n        trace: List[VerdictStep] = []\n\n        # Step 1: Input Validation\n        trace.append(VerdictStep(\n            stage=\"1. Input Validation\",\n            rule_applied=\"Unicode Code Point Ingestion\",\n            outcome=f\"Ingested {metrics.length} code points\",\n            impact=\"NEUTRAL\",\n            security_reasoning=\"Password processed locally without truncation or silent modification.\"\n        ))\n\n        # Step 2: Policy Compliance\n        pol_outcome = \"PASS\" if policy_res.compliant else \"FAIL\"\n        trace.append(VerdictStep(\n            stage=\"2. Policy Verification\",\n            rule_applied=f\"DecodeLabs Baseline ({self.min_length_policy}+ chars, {self.min_classes_policy}+ classes)\",\n            outcome=pol_outcome,\n            impact=\"POSITIVE\" if policy_res.compliant else \"NEGATIVE\",\n            security_reasoning=policy_res.summary_message\n        ))\n\n        # Step 3: Pattern Analysis\n        sev_counts = {sev: sum(1 for f in findings if f.severity == sev) for sev in Severity}\n        pattern_summary = f\"{len(findings)} finding(s): {sev_counts[Severity.CRITICAL]} critical, {sev_counts[Severity.HIGH]} high, {sev_counts[Severity.MEDIUM]} medium.\"\n        trace.append(VerdictStep(\n            stage=\"3. Pattern Detection\",\n            rule_applied=\"Linear Scan for Predictable Structures\",\n            outcome=pattern_summary,\n            impact=\"NEGATIVE\" if findings else \"POSITIVE\",\n            security_reasoning=\"Detects spatial walks, sequences, repetitions, and leetspeak substitutions.\"\n        ))\n\n        # --- PRECEDENCE RULE ARBITRATION ---\n\n        # Precedence Rule 1: Known Common Password Match\n        has_common = any(f.id == \"VULN_COMMON_PASSWORD\" for f in findings)\n        if has_common:\n            trace.append(VerdictStep(\n                stage=\"4. Precedence Arbitration\",\n                rule_applied=\"PRECEDENCE_RULE_1: Known Weak Match Override\",\n                outcome=\"FORCED_WEAK\",\n                impact=\"CRITICAL\",\n                security_reasoning=(\n                    \"Credential appears in public offline weak password dictionaries. \"\n                    \"In accordance with NIST SP 800-63B guidelines, known weak passwords \"\n                    \"must be rejected regardless of length or character class variety.\"\n                )\n            ))\n            return RiskLevel.WEAK, trace\n\n        # Precedence Rule 2: Critical / Severe Length Failure (< 8)\n        if metrics.length < 8:\n            trace.append(VerdictStep(\n                stage=\"4. Precedence Arbitration\",\n                rule_applied=\"PRECEDENCE_RULE_2: Sub-8 Character Floor\",\n                outcome=\"FORCED_WEAK\",\n                impact=\"HIGH_RISK\",\n                security_reasoning=(\n                    f\"Length ({metrics.length}) is strictly under the 8-character minimum. \"\n                    \"Passwords shorter than 8 characters can be completely exhausted via GPU brute-force \"\n                    \"in minutes, regardless of character composition.\"\n                )\n            ))\n            return RiskLevel.WEAK, trace\n\n        # Precedence Rule 3: High-Severity Pattern Domination\n        has_high_pattern = any(f.severity in (Severity.CRITICAL, Severity.HIGH) for f in findings)\n        if has_high_pattern:\n            # Even if length is >= 8 and classes are high, severe pattern forces Weak or Medium\n            if metrics.length < 14:\n                trace.append(VerdictStep(\n                    stage=\"4. Precedence Arbitration\",\n                    rule_applied=\"PRECEDENCE_RULE_3: Severe Predictability Override\",\n                    outcome=\"FORCED_WEAK\",\n                    impact=\"HIGH_RISK\",\n                    security_reasoning=(\n                        \"Contains high-severity predictability patterns (such as obvious leetspeak substitution, \"\n                        \"extensive repetition, or long keyboard sweeps). Character variety cannot compensate for structural predictability.\"\n                    )\n                ))\n                return RiskLevel.WEAK, trace\n            else:\n                trace.append(VerdictStep(\n                    stage=\"4. Precedence Arbitration\",\n                    rule_applied=\"PRECEDENCE_RULE_3B: Length Mitigated Pattern\",\n                    outcome=\"DEGRADED_TO_MEDIUM\",\n                    impact=\"MODERATE_RISK\",\n                    security_reasoning=(\n                        \"Substantial length (>= 14 chars) provides keyspace volume, but detected predictability \"\n                        \"prevents qualification for STRONG status.\"\n                    )\n                ))\n                return RiskLevel.MEDIUM, trace\n\n        # Precedence Rule 4: Passphrase Exception (NIST SP 800-63B)\n        # If length >= 18, with zero high/medium findings, qualify as STRONG even if legacy 3-class rule fails\n        has_any_pattern = bool(findings)\n        if metrics.length >= 18 and not has_any_pattern:\n            trace.append(VerdictStep(\n                stage=\"4. Precedence Arbitration\",\n                rule_applied=\"PRECEDENCE_RULE_4A: NIST SP 800-63B Long Passphrase Qualification\",\n                outcome=\"CLASSIFIED_STRONG\",\n                impact=\"POSITIVE\",\n                security_reasoning=(\n                    f\"Extensive length ({metrics.length} code points) delivers immense search space resistance. \"\n                    \"Under NIST SP 800-63B guidelines, long passphrases (>= 18 chars) achieve high entropy \"\n                    \"without requiring artificial uppercase or digit substitutions.\"\n                )\n            ))\n            return RiskLevel.STRONG, trace\n\n        # Precedence Rule 4B: Moderate Pattern / Policy Non-Compliance\n        has_medium_pattern = any(f.severity == Severity.MEDIUM for f in findings)\n        if not policy_res.compliant or has_medium_pattern or metrics.length < 12:\n            trace.append(VerdictStep(\n                stage=\"4. Precedence Arbitration\",\n                rule_applied=\"PRECEDENCE_RULE_4B: Moderate Risk Balance\",\n                outcome=\"CLASSIFIED_MEDIUM\",\n                impact=\"MODERATE_RISK\",\n                security_reasoning=(\n                    \"Password satisfies minimum threshold without critical flaws, but fails either \"\n                    \"the diversity policy, contains moderate patterns, or has length under 12 characters.\"\n                )\n            ))\n            return RiskLevel.MEDIUM, trace\n\n        # Precedence Rule 5: Strong Qualification\n        trace.append(VerdictStep(\n            stage=\"4. Precedence Arbitration\",\n            rule_applied=\"PRECEDENCE_RULE_5: Clean High-Entropy Qualification\",\n            outcome=\"CLASSIFIED_STRONG\",\n            impact=\"POSITIVE\",\n            security_reasoning=(\n                f\"Password demonstrates robust length ({metrics.length} code points), passes organizational diversity \"\n                f\"policy, and exhibits no detectable sequences, spatial sweeps, or dictionary substitutions.\"\n            )\n        ))\n        return RiskLevel.STRONG, trace\n\n    def _calculate_entropy(self, metrics: CharacterMetrics) -> EntropyEstimate:\n        \"\"\"\n        Computes theoretical pool entropy: E = L * log2(R).\n        Includes educational explanations of theoretical vs real-world entropy.\n        \"\"\"\n        if metrics.length == 0 or metrics.estimated_charset_pool_size <= 1:\n            return EntropyEstimate(\n                bits=0.0,\n                pool_size=0,\n                formula_description=\"0 bits (Empty input)\",\n                educational_caveat=\"No characters entered.\"\n            )\n\n        bits = metrics.length * math.log2(metrics.estimated_charset_pool_size)\n\n        caveat = (\n            f\"Theoretical pool entropy calculated as L({metrics.length}) × log₂(R={metrics.estimated_charset_pool_size}) = {bits:.1f} bits. \"\n            \"IMPORTANT: This formula assumes each character is independently and uniformly chosen at random. \"\n            \"Human passwords exhibit strong non-uniformity (common words, predictable substitutions, predictable suffixes). \"\n            \"Therefore, theoretical entropy represents a mathematical upper bound, NOT true guessability.\"\n        )\n\n        return EntropyEstimate(\n            bits=round(bits, 2),\n            pool_size=metrics.estimated_charset_pool_size,\n            formula_description=f\"{metrics.length} chars × log₂({metrics.estimated_charset_pool_size} pool)\",\n            educational_caveat=caveat\n        )\n\n    def _build_empty_result(self) -> AnalysisResult:\n        \"\"\"Returns clean empty state when no input is provided.\"\"\"\n        metrics = CharacterMetrics(\n            length=0, upper_count=0, lower_count=0, digit_count=0,\n            symbol_count=0, whitespace_count=0, unicode_non_ascii_count=0,\n            combining_marks_count=0, unique_char_count=0,\n            estimated_charset_pool_size=0,\n            has_unicode_normalization_difference=False\n        )\n        policy_res = PolicyResult(\n            compliant=False, min_length_required=self.min_length_policy,\n            actual_length=0, has_upper=False, has_lower=False,\n            has_digit=False, has_symbol=False, classes_satisfied=0,\n            min_classes_required=self.min_classes_policy,\n            summary_message=\"No password entered.\"\n        )\n        entropy = EntropyEstimate(\n            bits=0.0, pool_size=0, formula_description=\"0 bits\",\n            educational_caveat=\"Awaiting password input.\"\n        )\n        return AnalysisResult(\n            risk_level=RiskLevel.WEAK,\n            policy_result=policy_res,\n            metrics=metrics,\n            entropy=entropy,\n            findings=[],\n            positive_observations=[],\n            limitations=[\"Enter a password above to begin analysis.\"],\n            verdict_trace=[],\n            recommendations=[\"Enter a candidate password into the input console to begin explainable analysis.\"]\n        )\n", "analyzer/patterns.py": "\"\"\"\nPredictable Pattern Detection Module for ENIGMA\nIdentifies structured vulnerabilities and human predictability patterns in passwords.\n\nAll detectors are designed to be efficient (O(n) where n is password length)\nand return structured findings with REDACTED evidence that never leaks secret credentials.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport re\nfrom dataclasses import dataclass\nfrom enum import Enum\nfrom typing import List, Optional\nfrom .common_passwords import is_common_password\n\n\nclass Severity(Enum):\n    CRITICAL = \"CRITICAL\"\n    HIGH = \"HIGH\"\n    MEDIUM = \"MEDIUM\"\n    LOW = \"LOW\"\n    INFO = \"INFO\"\n\n\n@dataclass(frozen=True)\nclass Finding:\n    \"\"\"Represents a discrete security finding produced by the analyzer.\"\"\"\n    id: str\n    title: str\n    severity: Severity\n    description: str\n    evidence_redacted: str\n    recommendation: str\n\n    def to_dict(self) -> dict:\n        return {\n            \"id\": self.id,\n            \"title\": self.title,\n            \"severity\": self.severity.value,\n            \"description\": self.description,\n            \"evidence\": self.evidence_redacted,\n            \"recommendation\": self.recommendation,\n        }\n\n\n# Standard QWERTY keyboard sequences for spatial walk detection\n_KEYBOARD_ROWS = [\n    \"1234567890-=\",\n    \"qwertyuiop[]\\\\\",\n    \"asdfghjkl;'\",\n    \"zxcvbnm,./\",\n]\n\n# Diagonal walks on standard QWERTY\n_KEYBOARD_DIAGONALS = [\n    \"1qaz\", \"2wsx\", \"3edc\", \"4rfv\", \"5tgb\",\n    \"6yhn\", \"7ujm\", \"8ik,\", \"9ol.\", \"0p;/\"\n]\n\n# Leetspeak translation table (targeting vowels and common consonants)\n_LEET_MAP = {\n    '@': 'a', '4': 'a',\n    '8': 'b',\n    '(': 'c', '<': 'c',\n    '3': 'e',\n    '1': 'i', '!': 'i', '|': 'i',\n    '0': 'o',\n    '5': 's', '$': 's',\n    '7': 't', '+': 't',\n}\n\n\ndef _redact_token(token: str, max_visible: int = 3) -> str:\n    \"\"\"Returns a privacy-safe preview of a substring (e.g. 'qwe...').\"\"\"\n    if len(token) <= max_visible:\n        return f\"{token[0]}...\"\n    return f\"{token[:max_visible]}...\"\n\n\ndef detect_repeated_characters(password: str) -> List[Finding]:\n    \"\"\"\n    Detects runs of identical characters (e.g., 'aaaa' or '1111')\n    and single-character dominance over the whole string.\n    \"\"\"\n    findings: List[Finding] = []\n    if len(password) < 3:\n        return findings\n\n    # 1. Consecutive identical character runs of 3 or more\n    pattern = re.compile(r'(.)\\1{2,}')\n    for match in pattern.finditer(password):\n        char = match.group(1)\n        run_len = len(match.group(0))\n        sev = Severity.HIGH if run_len >= 4 else Severity.MEDIUM\n        findings.append(Finding(\n            id=\"PATTERN_REPEAT_RUN\",\n            title=\"Consecutive Character Repetition\",\n            severity=sev,\n            description=f\"Contains {run_len} identical consecutive characters.\",\n            evidence_redacted=f\"Character '{char}' repeated {run_len} times consecutively.\",\n            recommendation=\"Avoid repeating identical characters consecutively. Use varied, independent characters.\"\n        ))\n\n    # 2. String dominance: one character accounts for >= 50% of the entire password\n    counts: dict[str, int] = {}\n    for ch in password:\n        counts[ch] = counts.get(ch, 0) + 1\n\n    max_char, max_count = max(counts.items(), key=lambda item: item[1])\n    dominance_ratio = max_count / len(password)\n    if dominance_ratio >= 0.5 and len(password) >= 6 and not any(f.id == \"PATTERN_REPEAT_RUN\" and f.severity == Severity.HIGH for f in findings):\n        findings.append(Finding(\n            id=\"PATTERN_REPEAT_DOMINANCE\",\n            title=\"Single Character Dominance\",\n            severity=Severity.HIGH,\n            description=f\"A single character comprises {int(dominance_ratio * 100)}% of the entire password.\",\n            evidence_redacted=f\"Character '{max_char}' appears {max_count} times across {len(password)} characters.\",\n            recommendation=\"Distribute character selection across independent sets rather than reusing a dominant symbol.\"\n        ))\n\n    return findings\n\n\ndef detect_sequences(password: str) -> List[Finding]:\n    \"\"\"\n    Detects alphabetical and numerical ascending/descending sequences\n    (e.g., '123', '12345', '987', 'abcdef', 'fedcba') in O(n) time.\n    \"\"\"\n    findings: List[Finding] = []\n    if len(password) < 3:\n        return findings\n\n    lowered = password.lower()\n    n = len(lowered)\n\n    # Scan for alphabetical sequences\n    i = 0\n    while i < n - 2:\n        # Check ascending alpha\n        if lowered[i].isalpha() and lowered[i+1].isalpha():\n            asc_len = 1\n            while (i + asc_len < n and lowered[i + asc_len].isalpha() and\n                   ord(lowered[i + asc_len]) - ord(lowered[i + asc_len - 1]) == 1):\n                asc_len += 1\n            if asc_len >= 3:\n                sample = _redact_token(password[i:i + asc_len])\n                findings.append(Finding(\n                    id=\"PATTERN_SEQ_ALPHA_ASC\",\n                    title=\"Ascending Alphabetical Sequence\",\n                    severity=Severity.HIGH if asc_len >= 5 else Severity.MEDIUM,\n                    description=f\"Contains an ascending alphabetical sequence of length {asc_len}.\",\n                    evidence_redacted=f\"Alphabetical run '{sample}' of length {asc_len} at offset {i}.\",\n                    recommendation=\"Avoid contiguous alphabetical progressions (e.g. abcde). Attackers test these systematically.\"\n                ))\n                i += asc_len\n                continue\n\n            # Check descending alpha\n            desc_len = 1\n            while (i + desc_len < n and lowered[i + desc_len].isalpha() and\n                   ord(lowered[i + desc_len - 1]) - ord(lowered[i + desc_len]) == 1):\n                desc_len += 1\n            if desc_len >= 3:\n                sample = _redact_token(password[i:i + desc_len])\n                findings.append(Finding(\n                    id=\"PATTERN_SEQ_ALPHA_DESC\",\n                    title=\"Descending Alphabetical Sequence\",\n                    severity=Severity.HIGH if desc_len >= 5 else Severity.MEDIUM,\n                    description=f\"Contains a descending alphabetical sequence of length {desc_len}.\",\n                    evidence_redacted=f\"Reverse alphabetical run '{sample}' of length {desc_len} at offset {i}.\",\n                    recommendation=\"Avoid reverse alphabetical progressions (e.g. fedcb).\"\n                ))\n                i += desc_len\n                continue\n\n        # Check numerical sequences\n        if lowered[i].isdigit() and lowered[i+1].isdigit():\n            asc_len = 1\n            while (i + asc_len < n and lowered[i + asc_len].isdigit() and\n                   ord(lowered[i + asc_len]) - ord(lowered[i + asc_len - 1]) == 1):\n                asc_len += 1\n            if asc_len >= 3:\n                sample = _redact_token(password[i:i + asc_len])\n                findings.append(Finding(\n                    id=\"PATTERN_SEQ_NUM_ASC\",\n                    title=\"Ascending Numerical Sequence\",\n                    severity=Severity.HIGH if asc_len >= 5 else Severity.MEDIUM,\n                    description=f\"Contains an ascending numerical progression of length {asc_len}.\",\n                    evidence_redacted=f\"Numeric sequence '{sample}' of length {asc_len} at offset {i}.\",\n                    recommendation=\"Avoid consecutive counting numbers (e.g. 123456). These are standard in dictionary attacks.\"\n                ))\n                i += asc_len\n                continue\n\n            desc_len = 1\n            while (i + desc_len < n and lowered[i + desc_len].isdigit() and\n                   ord(lowered[i + desc_len - 1]) - ord(lowered[i + desc_len]) == 1):\n                desc_len += 1\n            if desc_len >= 3:\n                sample = _redact_token(password[i:i + desc_len])\n                findings.append(Finding(\n                    id=\"PATTERN_SEQ_NUM_DESC\",\n                    title=\"Descending Numerical Sequence\",\n                    severity=Severity.HIGH if desc_len >= 5 else Severity.MEDIUM,\n                    description=f\"Contains a descending numerical progression of length {desc_len}.\",\n                    evidence_redacted=f\"Reverse numeric run '{sample}' of length {desc_len} at offset {i}.\",\n                    recommendation=\"Avoid reverse counting sequences (e.g. 654321).\"\n                ))\n                i += desc_len\n                continue\n\n        i += 1\n\n    return findings\n\n\ndef detect_repeated_chunks(password: str) -> List[Finding]:\n    \"\"\"\n    Detects repeated chunks/n-grams (e.g. 'abcabcabc', '121212', 'passpass').\n    Scans for chunk sizes 2, 3, 4 repeated 2 or more times.\n    \"\"\"\n    findings: List[Finding] = []\n    if len(password) < 4:\n        return findings\n\n    lowered = password.lower()\n    for chunk_size in (2, 3, 4, 5):\n        pattern = re.compile(rf'(.{{{chunk_size}}})\\1+')\n        for match in pattern.finditer(lowered):\n            full_match = match.group(0)\n            chunk = match.group(1)\n            repetitions = len(full_match) // chunk_size\n            if repetitions >= 2:\n                sample = _redact_token(chunk)\n                findings.append(Finding(\n                    id=\"PATTERN_CHUNK_REPEAT\",\n                    title=\"Repetitive Substring Chunk\",\n                    severity=Severity.MEDIUM if repetitions == 2 else Severity.HIGH,\n                    description=f\"Chunk of {chunk_size} characters repeated {repetitions} times.\",\n                    evidence_redacted=f\"Pattern '{sample}' repeated {repetitions} times.\",\n                    recommendation=\"Avoid repeating the same phrase or syllable to inflate length.\"\n                ))\n                return findings\n\n    return findings\n\n\ndef detect_keyboard_walks(password: str) -> List[Finding]:\n    \"\"\"\n    Detects spatial keyboard walks along QWERTY rows, reverse rows, and diagonals.\n    e.g., 'qwerty', 'asdfgh', '1qaz', 'zxcvbn'.\n    \"\"\"\n    findings: List[Finding] = []\n    if len(password) < 4:\n        return findings\n\n    lowered = password.lower()\n    \n    # Check horizontal rows (forward and reverse)\n    for row in _KEYBOARD_ROWS:\n        rev_row = row[::-1]\n        for candidate_row in (row, rev_row):\n            for window in range(len(candidate_row), 3, -1):\n                for start in range(len(candidate_row) - window + 1):\n                    walk = candidate_row[start:start + window]\n                    if walk in lowered:\n                        sample = _redact_token(walk)\n                        findings.append(Finding(\n                            id=\"PATTERN_KEYBOARD_WALK\",\n                            title=\"Keyboard Spatial Walk (QWERTY)\",\n                            severity=Severity.HIGH if window >= 5 else Severity.MEDIUM,\n                            description=f\"Contains a {window}-key keyboard walk along adjacent keys.\",\n                            evidence_redacted=f\"Adjacent key sequence '{sample}' ({window} keys).\",\n                            recommendation=\"Avoid sliding across physical keyboard rows. Attackers prioritize keyboard walks.\"\n                        ))\n                        return findings\n\n    # Check diagonals (forward and reverse)\n    for diag in _KEYBOARD_DIAGONALS:\n        rev_diag = diag[::-1]\n        for d in (diag, rev_diag):\n            if d in lowered:\n                sample = _redact_token(d)\n                findings.append(Finding(\n                    id=\"PATTERN_KEYBOARD_DIAGONAL\",\n                    title=\"Diagonal Keyboard Walk\",\n                    severity=Severity.HIGH,\n                    description=f\"Contains a diagonal keyboard walk ('{sample}').\",\n                    evidence_redacted=f\"Diagonal walk '{sample}' detected.\",\n                    recommendation=\"Avoid diagonal keyboard columns (e.g., 1qaz, 2wsx). Standard cracking dictionaries include these.\"\n                ))\n                return findings\n\n    return findings\n\n\ndef detect_leetspeak_substitutions(password: str) -> List[Finding]:\n    \"\"\"\n    Detects common character substitutions (e.g. '@' -> 'a', '0' -> 'o', '3' -> 'e', '$' -> 's').\n    Checks whether the de-leeted string or its core root word matches a known weak password.\n    \"\"\"\n    findings: List[Finding] = []\n    if len(password) < 4:\n        return findings\n\n    lowered = password.lower()\n    has_leet_chars = any(ch in _LEET_MAP for ch in lowered)\n    if not has_leet_chars:\n        return findings\n\n    # 1. Full string translation\n    translated_full = \"\".join(_LEET_MAP.get(ch, ch) for ch in lowered)\n\n    # 2. Raw core extraction (strip leading/trailing digits, punctuation, and underscores)\n    raw_core = re.sub(r'^[\\d\\W_]+|[\\d\\W_]+$', '', lowered)\n    translated_core = \"\".join(_LEET_MAP.get(ch, ch) for ch in raw_core) if raw_core else \"\"\n\n    match_found = False\n    matched_word = \"\"\n\n    # Check full translation first\n    is_match_full, _ = is_common_password(translated_full)\n    if is_match_full and translated_full != lowered:\n        match_found = True\n        matched_word = translated_full\n    elif translated_core and len(translated_core) >= 4 and translated_core != raw_core:\n        # Check core root word translation\n        is_match_core, _ = is_common_password(translated_core)\n        if is_match_core:\n            match_found = True\n            matched_word = translated_core\n\n    if match_found:\n        used_subs = sorted(list({f\"'{ch}' -> '{_LEET_MAP[ch]}'\" for ch in lowered if ch in _LEET_MAP}))\n        sample_root = _redact_token(matched_word)\n        findings.append(Finding(\n            id=\"PATTERN_LEETSPEAK_SUBSTITUTION\",\n            title=\"Predictable Leetspeak Substitution\",\n            severity=Severity.HIGH,\n            description=\"Uses predictable character substitutions on a known common password base.\",\n            evidence_redacted=f\"Substitutions [{', '.join(used_subs)}] decode to weak base '{sample_root}'.\",\n            recommendation=\"Do not rely on simple substitutions (e.g. '@' for 'a', '0' for 'o'). Modern cracking rulesets unmask these instantly.\"\n        ))\n\n    return findings\n\n\ndef detect_date_or_year_patterns(password: str) -> List[Finding]:\n    \"\"\"\n    Detects 4-digit years (1940-2035) and common date formats (YYYYMMDD, DDMMYYYY).\n    \"\"\"\n    findings: List[Finding] = []\n    if len(password) < 4:\n        return findings\n\n    # 1. 4-digit year at end, start, or boundary\n    year_match = re.search(r'(19[4-9]\\d|20[0-3]\\d)', password)\n    if year_match:\n        year_str = year_match.group(1)\n        start_idx = year_match.start()\n        end_idx = year_match.end()\n        is_boundary = (start_idx == 0 or end_idx == len(password) or \n                       password[start_idx - 1] in \"_-@.!#\" or \n                       (end_idx < len(password) and password[end_idx] in \"_-@.!#\"))\n        \n        findings.append(Finding(\n            id=\"PATTERN_CALENDAR_YEAR\",\n            title=\"Calendar Year Pattern\",\n            severity=Severity.MEDIUM if is_boundary else Severity.LOW,\n            description=\"Contains a recognizable four-digit calendar year (1940-2035).\",\n            evidence_redacted=f\"Year '{year_str}' detected at position {start_idx}.\",\n            recommendation=\"Avoid appending birth years or current years to passwords. Attackers prioritize year masks.\"\n        ))\n\n    # 2. Standard 8-digit date pattern (YYYYMMDD or DDMMYYYY) bounded by non-digits or string ends\n    date_match = re.search(r'(?:^|\\D)(19\\d\\d|20\\d\\d)(0[1-9]|1[0-2])(0[1-9]|[12]\\d|3[01])(?:\\D|$)', password)\n    if not date_match:\n        date_match = re.search(r'(?:^|\\D)(0[1-9]|[12]\\d|3[01])(0[1-9]|1[0-2])(19\\d\\d|20\\d\\d)(?:\\D|$)', password)\n\n    if date_match:\n        findings.append(Finding(\n            id=\"PATTERN_CALENDAR_DATE\",\n            title=\"Full Calendar Date Pattern\",\n            severity=Severity.HIGH,\n            description=\"Contains a full 8-digit formatted calendar date.\",\n            evidence_redacted=f\"Date sequence detected at offset {date_match.start()}.\",\n            recommendation=\"Do not use birthdates, anniversary dates, or formatted calendar timestamps.\"\n        ))\n\n    return findings\n\n\ndef run_all_pattern_detectors(password: str) -> List[Finding]:\n    \"\"\"\n    Executes all pattern detectors sequentially and aggregates findings.\n    Each detector is linear in input length O(n).\n    \"\"\"\n    findings: List[Finding] = []\n    findings.extend(detect_repeated_characters(password))\n    findings.extend(detect_sequences(password))\n    findings.extend(detect_repeated_chunks(password))\n    findings.extend(detect_keyboard_walks(password))\n    findings.extend(detect_leetspeak_substitutions(password))\n    findings.extend(detect_date_or_year_patterns(password))\n    return findings\n", "analyzer/recommendations.py": "\"\"\"\nContext-Aware Recommendations Engine for ENIGMA\nGenerates prioritized, defensible, actionable guidance based on detected vulnerabilities.\n\nAvoids simplistic advice (such as \"just append !1 to the end\") which creates\nfalse senses of security against modern rule-based cracking tools.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom typing import List, TYPE_CHECKING\n\nif TYPE_CHECKING:\n    from .engine import AnalysisResult\n\n\ndef generate_recommendations(result: AnalysisResult) -> List[str]:\n    \"\"\"\n    Produces prioritized security recommendations tailored to the specific findings.\n    \"\"\"\n    recs: List[str] = []\n\n    # 1. Critical common password match\n    if any(f.id == \"VULN_COMMON_PASSWORD\" for f in result.findings):\n        recs.append(\n            \"CRITICAL: Replace this password entirely. It appears in public lists of known weak \"\n            \"or compromised passwords and will be cracked instantly by standard dictionary attacks.\"\n        )\n\n    # 2. Length deficiencies\n    if result.metrics.length == 0:\n        return [\"Enter a password to initiate explainable risk analysis.\"]\n\n    if result.metrics.length < 8:\n        recs.append(\n            \"Increase length to at least 12–16 characters. Passwords shorter than 8 characters \"\n            \"can be exhausted via offline brute force in seconds regardless of character complexity.\"\n        )\n    elif result.metrics.length < 12 and result.risk_level.value != \"STRONG\":\n        recs.append(\n            \"Expand length toward 14+ characters. Adding length provides exponential resistance \"\n            \"to brute-force attacks compared to merely swapping character cases.\"\n        )\n\n    # 3. Leetspeak substitutions\n    if any(f.id == \"PATTERN_LEETSPEAK_SUBSTITUTION\" for f in result.findings):\n        recs.append(\n            \"Avoid predictable substitutions (e.g., '@' for 'a', '0' for 'o', '$' for 's'). \"\n            \"Cracking software like Hashcat and John the Ripper applies rule engines (e.g., best64.rule) \"\n            \"that reverse these patterns in the first pass.\"\n        )\n\n    # 4. Keyboard walks and sequences\n    if any(f.id in (\"PATTERN_KEYBOARD_WALK\", \"PATTERN_KEYBOARD_DIAGONAL\") for f in result.findings):\n        recs.append(\n            \"Eliminate keyboard sweeps (e.g., 'qwerty', 'asdf', '1qaz'). Spatial walks have \"\n            \"near-zero search entropy and are checked immediately by attackers.\"\n        )\n\n    if any(\"PATTERN_SEQ\" in f.id for f in result.findings):\n        recs.append(\n            \"Remove numerical or alphabetical runs (e.g., '123456', 'abcdef'). Sequences \"\n            \"substantially decrease real-world guessability.\"\n        )\n\n    # 5. Repeated characters or chunks\n    if any(f.id in (\"PATTERN_REPEAT_RUN\", \"PATTERN_REPEAT_DOMINANCE\", \"PATTERN_CHUNK_REPEAT\") for f in result.findings):\n        recs.append(\n            \"Eliminate repeated characters or syllables. Repetition inflates character count \"\n            \"without contributing real cryptographic uncertainty.\"\n        )\n\n    # 6. Calendar dates or years\n    if any(f.id in (\"PATTERN_CALENDAR_YEAR\", \"PATTERN_CALENDAR_DATE\") for f in result.findings):\n        recs.append(\n            \"Avoid appending birth years, graduation years, or calendar dates (e.g., '2024', '1998'). \"\n            \"Year and date masks are among the first combinatorial attacks executed.\"\n        )\n\n    # 7. Character set diversity (if length is otherwise acceptable)\n    if result.metrics.length >= 8 and not result.policy_result.compliant:\n        missing = []\n        if not result.policy_result.has_upper:\n            missing.append(\"uppercase letters\")\n        if not result.policy_result.has_lower:\n            missing.append(\"lowercase letters\")\n        if not result.policy_result.has_digit:\n            missing.append(\"numbers\")\n        if not result.policy_result.has_symbol:\n            missing.append(\"special symbols\")\n        if missing:\n            recs.append(\n                f\"Policy compliance: Incorporate {', '.join(missing)} to satisfy organizational gatekeeper policies.\"\n            )\n\n    # 8. General passphrase advice for strong or improving passwords\n    if result.risk_level.value in (\"MEDIUM\", \"STRONG\") and len(recs) <= 1:\n        recs.append(\n            \"Consider using a multi-word passphrase (e.g., 4 or 5 random dictionary words separated by hyphens). \"\n            \"Passphrases offer high search spaces while remaining easy for humans to recall.\"\n        )\n\n    # 9. Operational hygiene (always applicable)\n    recs.append(\n        \"Operational Security: Never reuse passwords across different services. Store credentials \"\n        \"in an encrypted local or audited password manager, and enable multi-factor authentication (MFA).\"\n    )\n\n    return recs\n", "analyzer/generator.py": "\"\"\"\nCryptographically Secure Password & Passphrase Generator for ENIGMA\nUses Python's `secrets` module (CSPRNG via os.urandom) to generate high-entropy credentials.\n\nLocal-first: Generated credentials are created in-memory only and never persisted or transmitted.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport secrets\nimport string\nfrom typing import List\n\n# Memorable wordlist for Diceware-style passphrase generation (EFF-inspired)\n_PASSPHRASE_WORDS = [\n    \"abandon\", \"ability\", \"absorb\", \"abstract\", \"academy\", \"accent\", \"acoustic\", \"acquire\",\n    \"across\", \"action\", \"active\", \"actor\", \"adapt\", \"address\", \"advance\", \"aerobic\",\n    \"affair\", \"afford\", \"afraid\", \"agency\", \"agent\", \"agile\", \"agree\", \"ahead\",\n    \"airport\", \"alarm\", \"album\", \"alert\", \"alien\", \"alpha\", \"alpine\", \"alps\",\n    \"always\", \"amateur\", \"amazing\", \"amber\", \"ambient\", \"amend\", \"among\", \"amount\",\n    \"amused\", \"anchor\", \"ancient\", \"angel\", \"anger\", \"animal\", \"annual\", \"answer\",\n    \"antenna\", \"antique\", \"anvil\", \"apology\", \"apple\", \"approve\", \"apron\", \"arch\",\n    \"arctic\", \"arena\", \"argon\", \"armor\", \"arrow\", \"artist\", \"aspect\", \"assault\",\n    \"asset\", \"assist\", \"assume\", \"asteroid\", \"athlete\", \"atlas\", \"atom\", \"attack\",\n    \"attend\", \"attitude\", \"attract\", \"auction\", \"audit\", \"august\", \"author\", \"auto\",\n    \"autumn\", \"average\", \"avocado\", \"avoid\", \"awake\", \"aware\", \"awesome\", \"axis\",\n    \"badge\", \"baggage\", \"balance\", \"balcony\", \"ballot\", \"bamboo\", \"banana\", \"banner\",\n    \"baron\", \"barrel\", \"barrier\", \"basalt\", \"basic\", \"basket\", \"battery\", \"battle\",\n    \"beacon\", \"beauty\", \"behavior\", \"belief\", \"belong\", \"benefit\", \"best\", \"beyond\",\n    \"bicycle\", \"biology\", \"bison\", \"bitter\", \"bizarre\", \"blade\", \"blanket\", \"blast\",\n    \"blender\", \"blessing\", \"blind\", \"blizzard\", \"block\", \"blossom\", \"bonus\", \"booster\",\n    \"border\", \"bounce\", \"boundary\", \"bracket\", \"brave\", \"breeze\", \"brick\", \"bridge\",\n    \"brief\", \"bright\", \"brisk\", \"bronze\", \"bubble\", \"budget\", \"buffalo\", \"build\",\n    \"bulletin\", \"bundle\", \"bunker\", \"burst\", \"cabin\", \"cable\", \"cactus\", \"cage\",\n    \"calendar\", \"calm\", \"camera\", \"camp\", \"canary\", \"candle\", \"cannon\", \"canyon\",\n    \"capable\", \"capital\", \"captain\", \"carbon\", \"cardinal\", \"cargo\", \"carousel\", \"carpet\",\n    \"carrier\", \"carrot\", \"cascade\", \"castle\", \"catalyst\", \"catcher\", \"cave\", \"cedar\",\n    \"ceiling\", \"celery\", \"cement\", \"census\", \"central\", \"century\", \"cereal\", \"chain\",\n    \"chamber\", \"champion\", \"change\", \"channel\", \"chaos\", \"chapter\", \"charger\", \"chariot\",\n    \"charity\", \"charm\", \"chart\", \"chaser\", \"cheetah\", \"cherry\", \"chest\", \"chimney\",\n    \"cipher\", \"circuit\", \"citizen\", \"citrus\", \"civic\", \"civil\", \"classic\", \"climate\",\n    \"clinic\", \"clock\", \"clone\", \"cloth\", \"cloud\", \"clover\", \"cluster\", \"clutch\",\n    \"coastal\", \"cobra\", \"coffee\", \"cohort\", \"collect\", \"colony\", \"column\", \"combine\",\n    \"comfort\", \"comic\", \"command\", \"compact\", \"compass\", \"complex\", \"compost\", \"compute\",\n    \"concept\", \"concert\", \"conduit\", \"conifer\", \"connect\", \"conquer\", \"consent\", \"console\",\n    \"contact\", \"contour\", \"control\", \"convex\", \"copper\", \"coral\", \"corner\", \"corridor\",\n    \"cosmos\", \"cottage\", \"courage\", \"courier\", \"cradle\", \"craft\", \"crane\", \"crater\",\n    \"crayon\", \"creek\", \"crescent\", \"crest\", \"cricket\", \"crimson\", \"crisis\", \"critical\",\n    \"cross\", \"crowd\", \"crucial\", \"cruise\", \"crumble\", \"crystal\", \"cube\", \"culture\",\n    \"current\", \"curtain\", \"cushion\", \"custom\", \"cyclone\", \"cylinder\", \"dagger\", \"dairy\",\n    \"damage\", \"danger\", \"daring\", \"darkness\", \"daybreak\", \"daylight\", \"dazzle\", \"december\",\n    \"decimal\", \"decode\", \"deep\", \"defense\", \"defiant\", \"degree\", \"delta\", \"deluxe\",\n    \"density\", \"deposit\", \"depth\", \"deputy\", \"desert\", \"design\", \"desk\", \"destiny\",\n    \"detect\", \"device\", \"diagonal\", \"diagram\", \"diamond\", \"digest\", \"digital\", \"dignity\",\n    \"dilemma\", \"diploma\", \"direct\", \"disco\", \"discover\", \"display\", \"distance\", \"diver\",\n    \"diverse\", \"divide\", \"divine\", \"dock\", \"doctor\", \"document\", \"dolphin\", \"domain\",\n    \"domino\", \"donkey\", \"dorm\", \"double\", \"dove\", \"dragon\", \"drain\", \"dramatic\",\n    \"drift\", \"driver\", \"drone\", \"drum\", \"dryer\", \"duck\", \"dune\", \"duplicate\",\n    \"duration\", \"dusk\", \"dynamic\", \"eagle\", \"early\", \"earth\", \"easel\", \"echo\",\n    \"eclipse\", \"ecology\", \"economy\", \"edge\", \"editor\", \"educate\", \"effort\", \"elastic\",\n    \"elbow\", \"elder\", \"electric\", \"element\", \"elephant\", \"elevator\", \"elite\", \"embark\",\n    \"emblem\", \"emerald\", \"emerge\", \"emotion\", \"empire\", \"empower\", \"enact\", \"enclave\",\n    \"endless\", \"endorse\", \"endure\", \"energy\", \"enforce\", \"engage\", \"engine\", \"enigma\",\n    \"enhance\", \"enormous\", \"enough\", \"enter\", \"entropy\", \"entry\", \"envelope\", \"episode\",\n    \"epoch\", \"equal\", \"equip\", \"era\", \"erase\", \"erosion\", \"escape\", \"essay\",\n    \"essence\", \"estate\", \"eternal\", \"ethics\", \"evidence\", \"exact\", \"exceed\", \"excel\",\n    \"excess\", \"exchange\", \"exhibit\", \"exile\", \"expand\", \"expect\", \"expert\", \"explore\",\n    \"express\", \"extend\", \"extra\", \"fabric\", \"factor\", \"falcon\", \"fame\", \"fantasy\",\n    \"fathom\", \"feather\", \"feature\", \"federal\", \"feedback\", \"fellow\", \"fence\", \"ferret\",\n    \"festival\", \"fiber\", \"fiction\", \"field\", \"fierce\", \"filter\", \"final\", \"finance\"\n]\n\n\ndef generate_random_password(\n    length: int = 16,\n    use_upper: bool = True,\n    use_lower: bool = True,\n    use_digits: bool = True,\n    use_symbols: bool = True\n) -> str:\n    \"\"\"\n    Generates a cryptographically strong random password using secrets.choice.\n    Ensures at least one character from each selected class is included.\n    \"\"\"\n    if length < 8:\n        length = 8\n    if length > 128:\n        length = 128\n\n    pools: List[str] = []\n    guaranteed: List[str] = []\n\n    if use_upper:\n        pools.append(string.ascii_uppercase)\n        guaranteed.append(secrets.choice(string.ascii_uppercase))\n    if use_lower:\n        pools.append(string.ascii_lowercase)\n        guaranteed.append(secrets.choice(string.ascii_lowercase))\n    if use_digits:\n        pools.append(string.digits)\n        guaranteed.append(secrets.choice(string.digits))\n    if use_symbols:\n        symbols = \"!@#$%^&*()-_=+[]{}|;:,.<>?\"\n        pools.append(symbols)\n        guaranteed.append(secrets.choice(symbols))\n\n    # Fallback to alphanumeric if nothing selected\n    if not pools:\n        pools.append(string.ascii_letters + string.digits)\n        guaranteed.append(secrets.choice(string.ascii_letters))\n\n    combined_pool = \"\".join(pools)\n    remaining_len = length - len(guaranteed)\n    \n    # Fill remaining positions with cryptographically chosen characters\n    random_chars = [secrets.choice(combined_pool) for _ in range(remaining_len)]\n    full_list = guaranteed + random_chars\n\n    # Cryptographic Fisher-Yates shuffle\n    for i in range(len(full_list) - 1, 0, -1):\n        j = secrets.randbelow(i + 1)\n        full_list[i], full_list[j] = full_list[j], full_list[i]\n\n    return \"\".join(full_list)\n\n\ndef generate_passphrase(\n    word_count: int = 5,\n    separator: str = \"-\",\n    capitalize_words: bool = True,\n    append_number: bool = True\n) -> str:\n    \"\"\"\n    Generates an EFF-style multi-word passphrase using secrets.choice.\n    Combines high entropy with human memorability.\n    \"\"\"\n    if word_count < 3:\n        word_count = 3\n    if word_count > 10:\n        word_count = 10\n\n    chosen_words = [secrets.choice(_PASSPHRASE_WORDS) for _ in range(word_count)]\n    if capitalize_words:\n        chosen_words = [w.capitalize() for w in chosen_words]\n\n    passphrase = separator.join(chosen_words)\n    if append_number:\n        # Append a cryptographically random 2-digit number (10-99)\n        num = secrets.randbelow(90) + 10\n        passphrase = f\"{passphrase}{separator}{num}\"\n\n    return passphrase\n", "analyzer/timing.py": "\"\"\"\nTiming Attack Demonstrator and Gatekeeper Pipeline for ENIGMA\nImplements themes from Slide 11 and Slide 12 of the DecodeLabs Curriculum:\n\n- Slide 11: Timing Attacks & Constant-Time Verification (hmac.compare_digest)\n- Slide 12: Gatekeeper Rule (\"You cannot hash what is weak. Filter entropy before Argon2id.\")\n\"\"\"\n\nfrom __future__ import annotations\n\nimport hmac\nimport time\nfrom typing import Dict, Any\n\n\ndef run_timing_demonstration(iterations: int = 20000) -> Dict[str, Any]:\n    \"\"\"\n    Demonstrates the difference between standard string comparison ('==')\n    and constant-time comparison ('hmac.compare_digest').\n\n    Educational Demonstration:\n    - Target secret: 32-character token\n    - Test candidate A fails on character 0 (early exit in naive '==')\n    - Test candidate B fails on character 31 (late exit in naive '==')\n    - Constant-time comparison ensures identical execution profile regardless of mismatch offset.\n    \"\"\"\n    secret = \"a\" * 32\n    early_fail = \"b\" + \"a\" * 31  # Fails at index 0\n    late_fail = \"a\" * 31 + \"b\"   # Fails at index 31\n\n    # Standard equality (non-constant time)\n    start_early = time.perf_counter_ns()\n    for _ in range(iterations):\n        _ = (secret == early_fail)\n    elapsed_early_ns = time.perf_counter_ns() - start_early\n\n    start_late = time.perf_counter_ns()\n    for _ in range(iterations):\n        _ = (secret == late_fail)\n    elapsed_late_ns = time.perf_counter_ns() - start_late\n\n    # Constant-time comparison (hmac.compare_digest)\n    secret_bytes = secret.encode(\"utf-8\")\n    early_bytes = early_fail.encode(\"utf-8\")\n    late_bytes = late_fail.encode(\"utf-8\")\n\n    start_ct_early = time.perf_counter_ns()\n    for _ in range(iterations):\n        _ = hmac.compare_digest(secret_bytes, early_bytes)\n    elapsed_ct_early_ns = time.perf_counter_ns() - start_ct_early\n\n    start_ct_late = time.perf_counter_ns()\n    for _ in range(iterations):\n        _ = hmac.compare_digest(secret_bytes, late_bytes)\n    elapsed_ct_late_ns = time.perf_counter_ns() - start_ct_late\n\n    return {\n        \"iterations\": iterations,\n        \"standard_early_ns\": elapsed_early_ns,\n        \"standard_late_ns\": elapsed_late_ns,\n        \"standard_diff_ns\": abs(elapsed_late_ns - elapsed_early_ns),\n        \"constant_early_ns\": elapsed_ct_early_ns,\n        \"constant_late_ns\": elapsed_ct_late_ns,\n        \"constant_diff_ns\": abs(elapsed_ct_late_ns - elapsed_ct_early_ns),\n        \"explanation\": (\n            \"Standard comparison ('==') terminates immediately upon the first byte mismatch, \"\n            \"leaking position information via execution latency. In contrast, 'hmac.compare_digest' \"\n            \"inspects all bytes in constant time (using OpenSSL CRYPTO_memcmp), eliminating the timing side-channel.\"\n        )\n    }\n\n\ndef evaluate_gatekeeper_rule(length: int, has_classes: int, is_common: bool) -> Dict[str, Any]:\n    \"\"\"\n    Evaluates the 'Gatekeeper Rule' (Slide 12: 'Validation Before Encryption').\n\n    Principle:\n    - KDFs like Argon2id or bcrypt are intentionally computationally intensive (cost parameters).\n    - Hashing weak passwords wastes server resources and leaves credentials susceptible to dictionary precomputations.\n    - The Gatekeeper filters low-entropy or common inputs before any KDF computation occurs.\n    \"\"\"\n    if is_common:\n        return {\n            \"status\": \"REJECT\",\n            \"action\": \"HALT_BEFORE_HASHING\",\n            \"message\": \"Known weak credential. Immediate rejection prior to KDF execution.\",\n            \"kdf_cycles_saved\": True\n        }\n\n    if length < 8:\n        return {\n            \"status\": \"REJECT\",\n            \"action\": \"HALT_BEFORE_HASHING\",\n            \"message\": \"Length below 8 characters. Fails gatekeeper minimum policy.\",\n            \"kdf_cycles_saved\": True\n        }\n\n    if has_classes < 3:\n        return {\n            \"status\": \"WARN\",\n            \"action\": \"POLICY_EXCEPTION\",\n            \"message\": \"Acceptable length, but insufficient character diversity.\",\n            \"kdf_cycles_saved\": False\n        }\n\n    return {\n        \"status\": \"PASS\",\n        \"action\": \"PROCEED_TO_ARGON2ID\",\n        \"message\": \"Input passed gatekeeper entropy filtration. Cleared for Argon2id key derivation.\",\n        \"kdf_cycles_saved\": False\n    }\n", "analyzer/common_passwords.py": "\"\"\"\nCommon Passwords Module for ENIGMA\nProvides offline, local-first detection of known weak and commonly compromised passwords.\n\nSECURITY NOTE:\n- This is an offline dictionary check against a locally bundled list.\n- It does NOT transmit passwords over any network.\n- It does NOT claim to represent every breached credential in existence.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport hmac\nimport hashlib\nfrom pathlib import Path\nfrom typing import Optional, Set\n\n# Path to the offline common passwords dataset\n_DATA_PATH = Path(__file__).parent.parent / \"data\" / \"common_passwords.txt\"\n_COMMON_PASSWORDS: Optional[Set[str]] = None\n\n\ndef _load_common_passwords() -> Set[str]:\n    \"\"\"Loads common passwords into a memory-efficient set for O(1) lookup.\"\"\"\n    global _COMMON_PASSWORDS\n    if _COMMON_PASSWORDS is not None:\n        return _COMMON_PASSWORDS\n\n    loaded: set[str] = set()\n    if _DATA_PATH.exists():\n        with open(_DATA_PATH, \"r\", encoding=\"utf-8\", errors=\"ignore\") as f:\n            for line in f:\n                item = line.strip().lower()\n                if item:\n                    loaded.add(item)\n    _COMMON_PASSWORDS = frozenset(loaded)\n    return _COMMON_PASSWORDS\n\n\ndef is_common_password(candidate: str) -> tuple[bool, Optional[str]]:\n    \"\"\"\n    Checks if a password (or its normalized lowercase/trimmed form) matches\n    the offline common passwords list.\n    \n    Returns:\n        (is_match, matched_pattern_label)\n    \"\"\"\n    if not candidate:\n        return False, None\n\n    dictionary = _load_common_passwords()\n    lowered = candidate.lower()\n    trimmed = lowered.strip()\n\n    # Exact match or lowercase match\n    if lowered in dictionary:\n        return True, \"Exact match in top offline weak passwords dataset\"\n\n    if trimmed != lowered and trimmed in dictionary:\n        return True, \"Match in top offline weak passwords dataset (ignoring surrounding whitespace)\"\n\n    return False, None\n\n\ndef get_dataset_size() -> int:\n    \"\"\"Returns the number of entries in the local offline common passwords dataset.\"\"\"\n    return len(_load_common_passwords())\n\n\ndef secure_compare_digest(secret_a: str, secret_b: str) -> bool:\n    \"\"\"\n    Performs constant-time comparison of two strings using hmac.compare_digest.\n    \n    Used when comparing sensitive authentication tokens, password hashes, or HMAC digests\n    to mitigate timing side-channel attacks (Slide 11 of DecodeLabs assignment).\n    \"\"\"\n    return hmac.compare_digest(secret_a.encode(\"utf-8\"), secret_b.encode(\"utf-8\"))\n", "data/common_passwords.txt": "0000\n000000\n000000!\n000000#\n00000001\n0000001\n00000012\n000000123\n0000001234\n0000002020\n0000002021\n0000002022\n0000002023\n0000002024\n0000002025\n0000002026\n000000@\n000001\n000002\n000003\n000004\n000005\n000006\n000007\n000008\n000009\n000010\n000011\n000012\n000013\n000014\n000015\n000016\n000017\n000018\n000019\n000020\n000021\n000022\n000023\n000024\n000025\n000026\n000027\n000028\n000029\n000030\n000031\n000032\n000033\n000034\n000035\n000036\n000037\n000038\n000039\n000040\n000041\n000042\n
